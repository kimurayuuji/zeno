snippets:
  # git
  - name: git status
    keyword: gs
    snippet: git status
  - name: git commit
    keyword: gc
    snippet: git commit -m '{{commit_message}}'
  # ls
  - name: ls list
    keyword: ll
    snippet: ls -l
  - name: ls all
    keyword: la
    snippet: ls -la
  - name: ls tree
    keyword: lt
    snippet: ls -lT -L=4{{}}
  - name: ls all tree
    keyword: lat
    snippet: ls -laT -L=4
  # lasydocker
  - name: lazydocker
    keyword: ld
    snippet: lazydocker
  # lazysql
  - name: lazysql
    keyword: lq
    snippet: lazysql
  # lazygit
  - name: lazygit
    keyword: lg
    snippet: lazygit
  # claude
  - name: claude
    keyword: c
    snippet: cd ~/claude{{}}; claude
  # gemini
  - name: gemini
    keyword: g
    snippet: cd ~/gemini{{}}; gemini
  # zoxide
  - name: zoxide query
    keyword: Z
    snippet: $(zoxide query -l | fzf --preview "eza "{}" -1 --icons=always --color=always")
    context:
      lbuffer ; '.+\s'
  # fzf
  - name: fzf
    keyword: F
    snippet: $(fzf --preview "bat --color=always --style=numbers "{}"")
    context:
      lbuffer ; '.+\s'
  - name: fzf directory
    keyword: FD
    snippet: $(fd --type d | fzf --preview "eza "{}" -1 --icons=always --color=always")
    context:
      lbuffer ; '.+\s'
  # db
  - name: db script
    keyword: db
    snippet: $(fd --type f --extension sh . ${HOME}/work/md-database/db | fzf --preview "bat --color=always --style=numbers {}")
  # gh
  - name: gh dash
    keyword: gd
    snippet: gh dash
completions:
  - name: nb edit
    patterns:
      - "^nb e( .*)? $"
      - "^nb edit( .*)? $"
    sourceCommand: "nb ls --no-color | grep -E '^\\[[0-9]+\\]'"
    options:
      --ansi: true  # ← ANSIカラー有効
      --prompt: "'nb edit >'"
      --preview: "echo {} | sed -E 's/^\\[([0-9]+)\\].*/\\1/' | xargs nb show"
    callback: "sed -E 's/^\\[([0-9]+)\\].*/\\1/'"
  - name: nvim edit
    patterns:
      - "^nvim( .*)? $"
    sourceCommand: "fd --hidden --exclude .git --max-depth 4"
    options:
      --ansi: true
      --prompt: "'nvim > '"
      --preview: "[ -d {} ] && eza --tree --level=2 --icons=always --color=always {} || bat --color=always --style=numbers --line-range :500 {}"
    callback: "echo {}"
